# Archives, signs and uploads the iOS app to TestFlight. Manual trigger, main only.
# One-time setup (certificate, profile, API key, secrets): docs/release/testflight-checklist.md
name: Release (TestFlight)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    # App Store Connect only accepts builds made with the current iOS SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version and set paths
        run: |
          xcodebuild -version
          {
            echo "KEYCHAIN=$RUNNER_TEMP/tsuzuri-release.keychain-db"
            echo "SIGNING_DIR=$RUNNER_TEMP/signing"
            echo "ARCHIVE=$RUNNER_TEMP/Tsuzuri.xcarchive"
            echo "EXPORT_DIR=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"

      - name: Install signing certificate, profile and API key
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 API_KEY_P8 API_KEY_ID; do
            [[ -n "${!name}" ]] || { echo "::error::A release secret is empty ($name); see docs/release/testflight-checklist.md"; exit 1; }
          done
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          # Temporary keychain holding only the Apple Distribution identity; deleted in the last step.
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$SIGNING_DIR/distribution.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$SIGNING_DIR/distribution.p12" -k "$KEYCHAIN" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$SIGNING_DIR/distribution.p12"

          # App Store provisioning profile, where Xcode 16+ and older Xcodes look for it.
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$SIGNING_DIR/profile.mobileprovision"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGNING_DIR/profile.plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGNING_DIR/profile.plist")"
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$SIGNING_DIR/profile.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done

          printf '%s\n' "$API_KEY_P8" > "$SIGNING_DIR/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$SIGNING_DIR/AuthKey_$API_KEY_ID.p8"

          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Archive (signed, build ${{ github.run_number }}, commit ${{ github.sha }})
        run: |
          set -euo pipefail
          xcodebuild archive -quiet \
            -project Apps/iOS/Tsuzuri.xcodeproj -scheme Tsuzuri -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" TSUZURI_COMMIT="$GITHUB_SHA" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            TSUZURI_PROVISIONING_PROFILE="$PROFILE_UUID" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Verify the archive carries this commit and build number
        run: scripts/verify-archive.sh "$ARCHIVE" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER"

      - name: Export and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -n "$API_ISSUER_ID" ]] || { echo "::error::A release secret is empty (APP_STORE_CONNECT_API_ISSUER_ID)"; exit 1; }
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ARCHIVE/Products/Applications/Tsuzuri.app/Info.plist")"
          options="$SIGNING_DIR/ExportOptions.plist"
          cp Apps/iOS/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$bundle_id string $PROFILE_UUID" "$options"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" -exportOptionsPlist "$options" -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$SIGNING_DIR/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          echo "Uploaded build $GITHUB_RUN_NUMBER ($GITHUB_SHA) of $bundle_id to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete keychain, profile and key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$SIGNING_DIR" "$EXPORT_DIR"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
